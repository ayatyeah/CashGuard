  observable: "Пачка денег остаётся открыто на столе, когда входит/садится следующий клиент"
  conditions: "Операция с предыдущим клиентом завершена, деньги на столе не убраны"
  exclusions: "Деньги убраны в сейф до ухода клиента / прихода следующего (эталон: Х-5)"
  document: "Правила осуществления кассовых операций… (постановление Правления НБРК от 29.11.2019 № 231)"
  clause: "п. 20 (часть вторая)"
  url: "https://adilet.zan.kz/rus/docs/V1900019680"
  quote: "На рабочем месте кассового работника находятся наличные деньги клиента. Все ранее принятые наличные деньги хранятся в специальных устройствах, находящихся на рабочем месте кассового работника, закрывающихся на ключ…"
  interpretive: false
  train_examples: {"Х-4": 57}
  enabled: true
  source_verified: true

