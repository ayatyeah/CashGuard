  conditions: "Передача денег клиентом видна; пересчёта (машинка/вручную) после передачи нет"
  exclusions: "Пересчёт машинкой и вручную при клиенте (эталон: Х-5, Х-35, Х-39)"
  document: "Правила осуществления кассовых операций… (постановление Правления НБРК от 29.11.2019 № 231)"
  clause: "п. 19 подп. 2); п. 20 (часть первая)"
  url: "https://adilet.zan.kz/rus/docs/V1900019680"
  quote: "принимает банкноты с полистным пересчетом, монеты с пересчетом по кружкам с проверкой на подлинность и платежность наличных денег в соответствии с пунктами 57 и 58 Правил;"
  interpretive: false
  train_examples: {"Х-4": 68}
  enabled: true
  source_verified: true

