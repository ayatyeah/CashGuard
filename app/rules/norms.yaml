# Справочник типов нарушений → норматив РК.
# Формат — STACK.md, раздел 5. Дополнительные поля:
#   interpretive: true  — норма связанная/косвенная (прямого запрета в открытых актах РК нет);
#                         в описании для пользователя подавать как «связанное требование», не как прямую цитату.
#   train_examples      — train-видео, где тип встречается (таймкод разметки, с).
# Все цитаты сверены дословно с текстами adilet.zan.kz (API adilet, актуальные редакции на 17.10.2026).
#
# Документы:
#   D1 — Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
#        второго уровня…, утв. постановлением Правления НБРК от 29.11.2019 № 231 (ред. от 12.07.2026),
#        https://adilet.zan.kz/rus/docs/V1900019680
#   D2 — Правила организации охраны и устройства помещений банков второго уровня…, утв. постановлением
#        Правления НБРК от 24.02.2020 № 14, https://adilet.zan.kz/rus/docs/V2000020075
#   D3 — Правила осуществления обменных операций с наличной иностранной валютой в РК, утв. постановлением
#        Правления НБРК от 04.04.2019 № 49, https://adilet.zan.kz/rus/docs/V1900018545
#   D5 — Требования к обеспечению информационной безопасности банков…, утв. постановлением Правления АРРФР
#        от 03.04.2026 № 53, https://adilet.zan.kz/rus/docs/V2600038336

left_cash_unattended:
  title: "Наличные и ценности оставлены без присмотра при уходе кассира"
  observable: "Кассир встаёт и уходит из помещения; на столе остаются наличные, инкассаторская сумка, кассовый журнал, печати/пломбиратор"
  conditions: "Ценности видны на столе в момент ухода и после него; сейф перед уходом не открывался"
  exclusions: "Перед уходом ценности убраны в сейф, сейф закрыт и заперт (эталон: Х-25, Х-27)"
  document: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках второго уровня… (постановление Правления НБРК от 29.11.2019 № 231)"
  clause: "п. 20 (часть вторая); п. 22; п. 80"
  url: "https://adilet.zan.kz/rus/docs/V1900019680"
  quote: "На рабочем месте кассового работника находятся наличные деньги клиента. Все ранее принятые наличные деньги хранятся в специальных устройствах, находящихся на рабочем месте кассового работника, закрывающихся на ключ, предназначенных для хранения наличных денег (металлический шкаф, сейф, тележка, ящики стола, тумба)."
  quote2: "Кассовому работнику не допускается покидать рабочее место до окончания обслуживания клиента."
  interpretive: false
  train_examples: {"Х-26": 9, "Х-15": 15, "Х-24": 8}
  enabled: true
  source_verified: true

