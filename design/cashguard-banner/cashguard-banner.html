<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CashGuard — баннер Forte</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; padding: clamp(16px, 4vw, 64px); background: #0b0b0e; color: #fff; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
  .preview { max-width: 1240px; margin: 0 auto; }
  .cashguard-hero {
    position: relative; isolation: isolate; overflow: hidden;
    min-height: 320px; border: 1px solid #c42b70; border-radius: 22px;
    background: radial-gradient(ellipse at 96% 0%, #b91b5c 0%, transparent 51%),
      radial-gradient(ellipse at 49% 128%, #99134f 0%, transparent 58%),
      linear-gradient(112deg, #30051c 0%, #460421 47%, #59082c 73%, #290517 100%);
    box-shadow: inset 0 1px 0 #ffffff0c, 0 16px 48px #00000020;
  }
  .cashguard-hero::after {
    content: ""; pointer-events: none; position: absolute; inset: 0; z-index: -1;
    background: linear-gradient(110deg, #12000b26, transparent 60%);
  }
  .cashguard-hero__content { position: relative; z-index: 2; padding: 40px 48px; width: 69%; }
  .cashguard-hero__eyebrow { margin: 0 0 12px; color: #f2a3c8; font-size: 12px; font-weight: 600; letter-spacing: .13em; line-height: 1.4; }
  .cashguard-hero__title { margin: 0 0 5px; font-size: clamp(42px, 4.8vw, 62px); line-height: 1.05; font-weight: 700; letter-spacing: -.055em; }
  .cashguard-hero__subtitle { margin: 0 0 10px; font-size: clamp(18px, 2.05vw, 25px); line-height: 1.35; font-weight: 500; letter-spacing: -.025em; }
  .cashguard-hero__description { margin: 0; font-size: 17px; line-height: 1.55; color: #e5c9d8; }
  .cashguard-hero__button {
    display: inline-flex; align-items: center; justify-content: center; gap: 12px;
    min-height: 50px; margin-top: 24px; padding: 0 22px; border: 1px solid #fff;
    border-radius: 10px; background: #fff; color: #20151c; font: inherit;
    font-size: 15px; font-weight: 600; cursor: pointer;
    box-shadow: 0 4px 12px #16000a20; transition: background .15s ease, box-shadow .15s ease;
  }
  .cashguard-hero__button:hover { background: #f8eaf1; box-shadow: 0 6px 20px #16000a38; }
  .cashguard-hero__button:focus-visible { outline: 3px solid #ffc4e0; outline-offset: 5px; }
  .cashguard-hero__button svg { width: 19px; height: 19px; flex: none; }
  .cashguard-hero__mark {
    position: absolute; z-index: 1; pointer-events: none;
    width: 308px; height: 420px; right: 54px; top: 28px;
    transform: rotate(0deg); overflow: visible;
    filter: drop-shadow(-14px 18px 20px #21000c55);
  }
  @media (max-width: 1000px) {
    .cashguard-hero__content { padding: 34px; width: 76%; }
    .cashguard-hero__mark { right: 20px; opacity: .7; width: 255px; }
    .cashguard-hero__description { max-width: 420px; }
  }
  @media (max-width: 640px) {
    .cashguard-hero { min-height: 340px; border-radius: 18px; }
    .cashguard-hero__content { width: 100%; padding: 28px 24px; }
    .cashguard-hero__title { font-size: 45px; }
    .cashguard-hero__subtitle { max-width: 270px; font-size: 20px; }
    .cashguard-hero__description { max-width: 260px; font-size: 15px; }
    .cashguard-hero__mark { width: 235px; right: -62px; top: 65px; opacity: .19; }
    .cashguard-hero__button { margin-top: 25px; }
  }
  @media (prefers-reduced-motion: reduce) { .cashguard-hero__button { transition: none; } }
</style>
</head>
<body>
<main class="preview">
  <!-- Self-contained banner. Bind the button to the application's analysis flow. -->
  <section class="cashguard-hero" aria-labelledby="cashguard-title">
    <div class="cashguard-hero__content">
      <p class="cashguard-hero__eyebrow">FORTE · ВИДЕОАНАЛИТИКА</p>
      <h1 class="cashguard-hero__title" id="cashguard-title">CashGuard</h1>
      <p class="cashguard-hero__subtitle">Кассовые операции под контролем</p>
      <p class="cashguard-hero__description">Анализ видео, таймкоды и кадры для проверки.</p>
      <button class="cashguard-hero__button" type="button" id="cashguard-new-analysis">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        Новый анализ
      </button>
    </div>
    <svg class="cashguard-hero__mark" viewBox="-1 -1 21 32" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="forte-surface" x1="0" y1="0" x2="1" y2=".9">
          <stop offset="0" stop-color="#d44d8b"/><stop offset=".38" stop-color="#c43578"/>
          <stop offset=".72" stop-color="#a21b58"/><stop offset="1" stop-color="#690d38"/>
        </linearGradient>
        <linearGradient id="forte-edge" x1="0" y1="0" x2=".7" y2="1">
          <stop stop-color="#ffaad2" stop-opacity=".65"/><stop offset=".45" stop-color="#ffaad2" stop-opacity=".15"/><stop offset="1" stop-color="#ffaad2" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <g fill="url(#forte-surface)" stroke="url(#forte-edge)" stroke-width=".055"><path d="M14.8003 11.7568V17.0473C9.55487 17.0473 5.28082 21.3185 5.28082 26.5668V29.6104H-0.00683594V26.5668C-0.00683594 25.0379 0.226857 23.5654 0.657641 22.1773C1.51076 19.4377 3.13535 17.036 5.28082 15.2341C7.43756 13.418 10.118 12.2073 13.0575 11.861C13.629 11.7934 14.209 11.7597 14.8003 11.7597V11.7568Z"/><path d="M18.5253 -0.00585938V5.28461H14.8003C10.5403 5.28461 6.92231 8.09738 5.71442 11.966C3.29865 13.3512 1.31086 15.3954 -0.00683594 17.8562V14.8013C-0.00683594 6.63609 6.63512 -0.00585938 14.8003 -0.00585938H18.5253Z"/></g>
    </svg>
  </section>
</main>
<script>
// Integration hook: listen for "cashguard:new-analysis" on this banner or document.
document.getElementById('cashguard-new-analysis').addEventListener('click', function () {
  this.dispatchEvent(new CustomEvent('cashguard:new-analysis', { bubbles: true }));
});
</script>
</body>
</html>
